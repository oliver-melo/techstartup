<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techstartup - Gestão de Funcionários</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">TechStartup - Gestão de Funcionários</span>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- Seção de Cadastro / Edição -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="card-title mb-0">Cadastro de Funcionários</h5>
            </div>
            <div class="card-body">
                <form id="form-funcionario">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome" placeholder="Nome completo" required>
                        </div>
                        <div class="col-md-2">
                            <label for="idade" class="form-label">Idade</label>
                            <input type="number" class="form-control" id="idade" placeholder="Ex: 28" required>
                        </div>
                        <div class="col-md-3">
                            <label for="cargo" class="form-label">Cargo</label>
                            <input type="text" class="form-control" id="cargo" placeholder="Ex: Desenvolvedor" required>
                        </div>
                        <div class="col-md-3">
                            <label for="salario" class="form-label">Salário (R$)</label>
                            <input type="number" class="form-control" id="salario" step="0.01" min="0" placeholder="Ex: 5500.00" required>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="button" class="btn btn-primary" id="btn-salvar">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Seção da Tabela e Busca -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
                <h5 class="card-title mb-0">Lista de Funcionários</h5>
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <label for="tipo-busca" class="form-label mb-0 text-muted small">Buscar por:</label>
                    <select class="form-select form-select-sm w-auto" id="tipo-busca">
                        <option value="id">ID</option>
                        <option value="nome">Nome</option>
                    </select>
                    <input type="text" class="form-control form-control-sm w-auto" id="campo-busca" placeholder="Digite o valor...">
                    <button type="button" class="btn btn-primary btn-sm" id="btn-buscar">Buscar</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-limpar-busca">Mostrar Todos</button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nome</th>
                                <th>Idade</th>
                                <th>Cargo</th>
                                <th>Salário (R$)</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-corpo">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Seção de Relatórios -->
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0">Relatórios</h5>
            </div>
            <div class="card-body">
                <div class="d-flex flex-wrap gap-2 mb-3">
                    <button type="button" class="btn btn-outline-success btn-sm" id="btn-rel-salario">Salário > R$ 5000</button>
                    <button type="button" class="btn btn-outline-primary btn-sm" id="btn-rel-media">Média Salarial</button>
                    <button type="button" class="btn btn-outline-info btn-sm" id="btn-rel-cargos">Cargos Únicos</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-rel-maiusculo">Nomes em Maiúsculo</button>
                    <button type="button" class="btn btn-dark btn-sm" id="btn-rel-todos">Exibir Todos os Relatórios</button>
                </div>

                <div id="resultado-relatorios" class="alert alert-light border mb-0">
                    <p class="mb-0 text-muted">Cadastre funcionários ou clique nos botões acima para visualizar os relatórios.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
